<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E40AF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Square matching Brand Logo -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brandGrad)" filter="url(#brandGlow)" />

  <!-- Inner Subtle Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />

  <!-- Bold Stylized B Letter -->
  <text x="32" y="43" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#FFFFFF">B</text>

  <!-- brainArena Spark Accent Dot -->
  <circle cx="46" cy="18" r="3" fill="#FBBF24" />
</svg>