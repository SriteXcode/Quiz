<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuizHub" />
    <meta name="description" content="High-performance platform for Live Contests, Code Challenges, and Shorts Gyaan micro-learning." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Quiz Platform - Knowledge & Learning Hub</title>
    <style>
      html, body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
    </style>
    <script>
      // Restrict Zoom via Pinch, Wheel + Ctrl, and Keyboard Shortcuts
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });
    </script>
    <!-- Google Fonts: Poppins, Lato, Cinzel, Playfair Display & Alex Brush -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;600;700;800;900&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <!-- Google Identity Services SDK Preload -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-main)] transition-colors duration-300 min-h-screen antialiased">
    <div id="root">
      <!-- HTML Pre-React Animating Logo Loader -->
      <div id="initial-page-loader" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(135deg, #2563eb, #6366f1, #38bdf8); opacity: 0.8; filter: blur(8px); animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
          <div style="position: relative; width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <span style="color: #ffffff; font-weight: 900; font-size: 36px; letter-spacing: 1px;">Q</span>
          </div>
        </div>
        <div style="font-weight: 800; font-size: 24px; color: #38bdf8; margin-bottom: 8px; letter-spacing: -0.5px;">Quiz Platform</div>
        <div style="font-size: 13px; color: #94a3b8; letter-spacing: 0.5px;">Loading Knowledge & Contests...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
